# Domain config for solar/wind asset compliance tracking.
# Everything here is data, not code: swap this file (and the CSV/document
# archive it points to) for a different domain and the engine behaves
# identically.

domain: "Energy Assets"

source:
  type: csv
  path: "data/energy_assets_sample.csv"
  id_field: asset_id

contact:
  name_field: contact_name
  email_field: contact_email

rules:
  - id: cert_current
    field: certification_expiry
    type: not_expired
    max_age_days: 0
    severity: critical
    label: "Grid Cert Expiry"
    message: "Grid connection certification expired on {value}"

  - id: cert_doc_on_file
    type: document_on_file
    directory: "data/energy_assets_documents"
    filename_pattern: "{asset_id}_grid_connection_certificate.pdf"
    severity: critical
    label: "Grid Cert on File"
    message: "Grid connection certificate not found in document archive (expected {value})"

  - id: insurance_current
    field: insurance_expiry
    type: not_expired
    max_age_days: 0
    severity: critical
    label: "Insurance Expiry"
    message: "Insurance policy expired on {value}"

  - id: insurance_doc_on_file
    type: document_on_file
    directory: "data/energy_assets_documents"
    filename_pattern: "{asset_id}_insurance_certificate.pdf"
    severity: critical
    label: "Insurance Cert on File"
    message: "Insurance certificate not found in document archive (expected {value})"

  - id: permit_doc_on_file
    type: document_on_file
    directory: "data/energy_assets_documents"
    filename_pattern: "{asset_id}_permit.pdf"
    severity: critical
    label: "Permit on File"
    message: "Operating permit not found in document archive (expected {value})"

  - id: margin_min
    field: margin_pct
    type: min_value
    min: 5
    severity: warning
    label: "Margin %"
    message: "Margin {value}% is below the 5% minimum threshold for financing"

  - id: downtime_max
    field: downtime_hours
    type: max_value
    max: 100
    severity: warning
    label: "Downtime (hrs/yr)"
    message: "Downtime {value} hrs/yr exceeds the 100 hr maximum"

  - id: maintenance_status_valid
    field: maintenance_status
    type: allowed_values
    values: ["current", "scheduled"]
    severity: warning
    label: "Maintenance Status"
    message: "Maintenance status '{value}' is not acceptable (must be current or scheduled)"

excel:
  info_columns:
    - {field: asset_id, label: "Asset ID"}
    - {field: asset_name, label: "Asset Name"}
    - {field: location, label: "Location"}
    - {field: contact_name, label: "Responsible Contact"}
  notes_columns:
    - {field: notes, label: "Notes / Follow-up"}

email:
  subject_template: "Action Required: Compliance Issues for {asset_name}"
  body_template: |
    Hi {contact_name},

    This is follow-up reminder #{reminder_number} regarding compliance issues
    for {asset_name} ({asset_id}):

    {issues_list}

    Please provide updated information at your earliest convenience so we can
    keep this asset eligible for financing and tender submissions.

    Thanks,
    Compliance Tracker
